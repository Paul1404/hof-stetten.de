AWSTemplateFormatVersion: "2010-09-09"
Description: HTTPS delivery for hof-stetten.de with Vertex as the protected origin

Parameters:
  HostedZoneId:
    Type: String
    Description: Route 53 public hosted zone ID for hof-stetten.de
    AllowedPattern: "^Z[A-Z0-9]+$"
  DomainName:
    Type: String
    Default: hof-stetten.de
    Description: Apex domain served by CloudFront
    AllowedPattern: "^[a-z0-9.-]+$"
  VertexOriginDomain:
    Type: String
    Default: hof-stetten-origin.rke2.pdcd.net
    Description: Protected Vertex origin with a valid HTTPS certificate
    AllowedPattern: "^[a-z0-9.-]+$"
  OriginVerifySecret:
    Type: String
    NoEcho: true
    MinLength: 1
    Description: Existing CloudFront origin verification header value

Resources:
  ApexCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub "www.${DomainName}"
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Sub "www.${DomainName}"
          HostedZoneId: !Ref HostedZoneId
      ValidationMethod: DNS

  WwwRedirect:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-www-redirect"
      AutoPublish: true
      FunctionConfig:
        Comment: Redirect the www hostname to the canonical apex
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.headers.host.value !== 'www.hof-stetten.de' ||
              (request.method !== 'GET' && request.method !== 'HEAD')) return request;
          var parts = [];
          Object.keys(request.querystring).forEach(function (key) {
            var entry = request.querystring[key];
            var values = entry.multiValue || [entry];
            values.forEach(function (item) {
              parts.push(key + (item.value ? '=' + item.value : ''));
            });
          });
          var location = 'https://hof-stetten.de' + request.uri +
            (parts.length ? '?' + parts.join('&') : '');
          return { statusCode: 308, statusDescription: 'Permanent Redirect',
            headers: { location: { value: location }, 'cache-control': { value: 'public, max-age=86400' } } };
        }

  ApexDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases:
          - !Ref DomainName
          - !Sub "www.${DomainName}"
        Comment: !Sub "${DomainName} to Vertex"
        DefaultCacheBehavior:
          AllowedMethods:
            - DELETE
            - GET
            - HEAD
            - OPTIONS
            - PATCH
            - POST
            - PUT
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          TargetOriginId: RailwayOrigin
          ViewerProtocolPolicy: redirect-to-https
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt WwwRedirect.FunctionARN
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - DomainName: !Ref VertexOriginDomain
            Id: RailwayOrigin
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Ref OriginVerifySecret
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginKeepaliveTimeout: 5
              OriginProtocolPolicy: https-only
              OriginReadTimeout: 30
              OriginSSLProtocols:
                - TLSv1.2
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref ApexCertificate
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only

  DomainRecords:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget:
            DNSName: !GetAtt ApexDistribution.DomainName
            EvaluateTargetHealth: false
            HostedZoneId: Z2FDTNDATAQYW2
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt ApexDistribution.DomainName
            EvaluateTargetHealth: false
            HostedZoneId: Z2FDTNDATAQYW2
        - Name: !Sub "www.${DomainName}"
          Type: A
          AliasTarget:
            DNSName: !GetAtt ApexDistribution.DomainName
            EvaluateTargetHealth: false
            HostedZoneId: Z2FDTNDATAQYW2
        - Name: !Sub "www.${DomainName}"
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt ApexDistribution.DomainName
            EvaluateTargetHealth: false
            HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  DistributionId:
    Description: CloudFront distribution ID for the apex domain
    Value: !Ref ApexDistribution
  DistributionDomainName:
    Description: CloudFront domain used by the Route 53 aliases
    Value: !GetAtt ApexDistribution.DomainName
  SiteUrl:
    Description: Public HTTPS URL
    Value: !Sub "https://${DomainName}"
